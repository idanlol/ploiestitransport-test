<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>SVG to WebP Exporter</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
  <h2>Exportator Rapid SVG -> WebP</h2>
  <button onclick="exportWebP()" style="padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">Generează WebP-uri</button>
  <div id="results" style="margin-top: 20px;"></div>

  <script>
    const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="23 0 310 191" width="100%" height="100%">
                        <style>
                          .myTP_svg {
                            fill: none;
                            stroke: #1111ff;
                            stroke-width: 12;
                            stroke-linecap: round;
                            stroke-linejoin: round;
                          }
                          .TP_svg {
                            stroke-width: 25;
                          }
                        </style>
                        <path class="myTP_svg" d="
                          M 29 107
                          C 34 125, 46 119, 49 104
                          C 56 76, 62 44, 66 44
                          C 67 44, 72 86, 76 114
                          C 78 126, 84 125, 86 110
                          C 92 84, 99 46, 103 46
                          C 103 46, 108 96, 112 114
                          C 115 126, 122 133, 130 112
                          C 133 102, 134 96, 139 96
                          C 139 96, 135 128, 152 127
                          C 159 126, 169 112, 175 96
                          C 169 135, 153 178, 134 184
                          C 119 188, 115 172, 120 164
                          C 139 136, 167 154, 200 120
                        " />
                        <line class="myTP_svg TP_svg" x1="200" y1="45" x2="250" y2="45" />
                        <line class="myTP_svg TP_svg" x1="225" y1="45" x2="225" y2="120" />
                        <line class="myTP_svg TP_svg" x1="280" y1="45" x2="280" y2="120" />
                        <path class="myTP_svg TP_svg" d="
                          M 280 45
                          C 280 45, 320 35, 320 65
                          C 320 65, 320 95, 280 85
                        " />
                      </svg>`;

    function exportWebP() {
      const sizes = [
        { name: 'logo-48px.webp', w: 48, h: 48 },
        { name: 'logo-512px.webp', w: 512, h: 512 },
        { name: 'logo-1080px.webp', w: 1080, h: 1080 }
      ];

      const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();

      img.onload = function() {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        // Dimensiunile originale ale viewBox-ului tău (335 lățime, 191 înălțime)
        const svgAspect = 287 / 191;

        sizes.forEach(sz => {
          const canvas = document.createElement('canvas');
          canvas.width = sz.w;
          canvas.height = sz.h;
          const ctx = canvas.getContext('2d');

          // Calculăm mărimea și poziția ca să rămână centrat proporțional pe canvas pătrat
          let drawW = sz.w;
          let drawH = sz.w / svgAspect;
          let offsetX = 0;
          let offsetY = (sz.h - drawH) / 2;

          if (drawH > sz.h) {
            drawH = sz.h;
            drawW = sz.h * svgAspect;
            offsetX = (sz.w - drawW) / 2;
            offsetY = 0;
          }

          // Curățăm canvasul (devine transparent în zonele goale de sus/jos)
          ctx.clearRect(0, 0, sz.w, sz.h);
          
          // Desenăm imaginea fix la coordonatele calculate (centrată)
          ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

          // Folosim toBlob ca să ocolim eroarea de DownloadManager din Acode
          canvas.toBlob(function(blobResult) {
            const blobUrl = URL.createObjectURL(blobResult);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = sz.name;
            a.textContent = `Descarcă ${sz.name} (${sz.w}x${sz.h})`;
            a.style = "display: block; margin: 10px auto; color: #60a5fa; font-size: 18px; text-decoration: none;";
            resultsDiv.appendChild(a);
          }, 'image/webp', 1.0);
        });
      };
      img.src = url;
    }
  </script>
</body>
</html>
