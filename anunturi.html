<!DOCTYPE html>
<html lang="ro">

<head>
  <title>MyTP - Anunturi</title>
  <link rel="icon" type="image/webp" href="/Content/icon/MyTP-48px.webp">
  <meta charset="utf-8">
  <meta name="theme-color" content="#111155">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Află ultimele anunțuri TCE Ploiești: devieri de trasee, restricții de circulație, modificări de program și noutăți despre transportul public.">
  <link rel="canonical" href="https://mytp.pages.dev/anunturi">
  <meta property="og:title" content="Anunțuri și modificări trasee TCE Ploiești - MyTP">
  <meta property="og:description" content="Devieri de trasee, restricții de circulație și modificări de program TCE Ploiești.">
  <meta property="og:url" content="https://mytp.pages.dev/anunturi">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="./styles.css">
  <style>
  </style>


</head>
    
<body>
  <div id=menuopen></div>
  <div id=deadTopSpace></div>
  <header id=titlu></header>
  <div id=fixbtn></div>

  <h1 class="sr-only">
    Anunțuri și modificări trasee TCE Ploiești
  </h1>


  <div style="text-align: center;" class="anuntHint mb_5 display_flex justSelf_center justify_center">Click pe oricare anunt pentru a vedea mai multe detalii</div>
  <div class="gap_1 gap_r_3 display_flex flexDir_row_r justSelf_center">
    <div id=newscard class="card noscrollbar width_fitcontent height_fitcontent gap_07 gap_r_2 display_flex flexDir_col gnews">
      
    </div>
  </div>

  <div id="footer"></div>
  

  <script src="./Scripts/UiElements.js"></script>
  <script src="./Scripts/news.js"></script>
  <script>

    fetch('./JSON/anunturi.json')
      .then(response => response.json())
      .then(data => {
        data.Anunturi.reverse().forEach(anunt => {
          anunt.TraseeAfectate.forEach(trafec => {
            TrAfectFull += TrAfectPreset(trafec);
          })
          document.getElementById('newscard').innerHTML += AnuntPreset(anunt);
          TrAfectFull = ``;
        });
      });
    
  </script>
</body>

</html>
