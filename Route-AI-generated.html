<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <title>Planificator Rută - TransPloiești</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <!-- Leaflet CSS pentru hartă -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* Stiluri suplimentare specifice cardurilor de rută stil Moovit */
    .route-card {
      background: var(--card-bg, #1e1e2f);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
    }
    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      opacity: 0.85;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
    .route-steps {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
    }
    .route-pill {
      background: #3b82f6;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .step-icon {
      font-size: 1.2rem;
      display: inline-flex;
      align-items: center;
    }
    .route-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.850rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
    }
    #routeMap {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: none; /* Ascuns până încărcăm datele pe hartă */
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id=menuopen></div>
  <div id=fixbtn></div>
  <div id="titlu"></div>
  <div id="deadTopSpace"></div>

  <div class="contentwrap display_flex flexDir_row justSelf_center justify_center" style="margin-top: 2vmax; padding: 0 10px;">
    <div style="width: 100%; max-width: 600px;" class="display_flex flexDir_col gap_2 justSelf_center">
      
      <!-- Antet cu stațiile alese -->
      <div class="card display_flex flexDir_col gap_1" style="padding: 14px;">
        <div id="infoPlecare" style="display: flex; align-items: center; gap: 8px;">🟢 De la: ...</div>
        <div id="infoSosire" style="display: flex; align-items: center; gap: 8px;">🔴 Până la: ...</div>
        <button onclick="toggleMap()" class="abtnlink" style="margin-top: 8px; text-align: center; cursor: pointer;">🗺️ Vezi traseul pe hartă</button>
      </div>

      <!-- Harta Leaflet (Opțională / Toggle) -->
      <div id="routeMap"></div>

      <!-- Container rezultate rute -->
      <div id="routeResultsContainer" class="display_flex flexDir_col gap_2">
        <div style="text-align: center; padding: 20px;">Se caută rute optime...</div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./Scripts/UiElements.js"></script>
  <script>
    let map = null;
    let mapInitialized = false;

    function initMap(lat, lon) {
      if (!mapInitialized) {
        map = L.map('routeMap').setView([lat || 44.9367, lon || 26.0130], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);
        mapInitialized = true;
      }
    }

    function toggleMap() {
      const mapDiv = document.getElementById('routeMap');
      if (mapDiv.style.display === 'none' || mapDiv.style.display === '') {
        mapDiv.style.display = 'block';
        if (map) map.invalidateSize();
      } else {
        mapDiv.style.display = 'none';
      }
    }

    function calculeazaDistantaMetri(coord1, coord2) {
        if (!coord1 || !coord2) return 999999;
        const [lat1, lon1] = coord1.split(',').map(Number);
        const [lat2, lon2] = coord2.split(',').map(Number);
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    const urlParams = new URLSearchParams(window.location.search);
    let fromId = urlParams.get('from');
    let toId = urlParams.get('to');

    /*testing*/ if (fromId === null || toId === null) {
      fromId = "S50001";
      toId = "S50010";
      // toId = "S50010";
    }
    
    const infoPlecareDiv = document.getElementById('infoPlecare');
    const infoSosireDiv = document.getElementById('infoSosire');
    const resultsContainer = document.getElementById('routeResultsContainer');

    if (!fromId || !toId) {
      resultsContainer.innerHTML = `<div class="route-card" style="text-align: center; color: #ff8888;">Lipsește stația de plecare sau de sosire.</div>`;
    } else {
      fetch('./JSON/trasee.json')
        .then(response => response.json())
        .then(data => {
          const statiePlecareObj = data.IDs.find(s => s.stopId === fromId);
          const statieSosireObj = data.IDs.find(s => s.stopId === toId);

          const numePlecare = statiePlecareObj ? statiePlecareObj.nume : fromId;
          const numeSosire = statieSosireObj ? statieSosireObj.nume : toId;

          infoPlecareDiv.innerHTML = `🟢 <strong>De la:</strong> ${numePlecare}`;
          infoSosireDiv.innerHTML = `🔴 <strong>Până la:</strong> ${numeSosire}`;

          // Inițializăm harta pe coordonatele stației de plecare dacă există
          if (statiePlecareObj && statiePlecareObj.coord) {
            const [pLat, pLon] = statiePlecareObj.coord.split(',').map(Number);
            initMap(pLat, pLon);
            L.marker([pLat, pLon]).addTo(map).bindPopup(`<b>Plecare:</b> ${numePlecare}`);
          }
          if (statieSosireObj && statieSosireObj.coord) {
            const [sLat, sLon] = statieSosireObj.coord.split(',').map(Number);
            L.marker([sLat, sLon]).addTo(map).bindPopup(`<b>Sosire:</b> ${numeSosire}`);
          }

          let ruteDirecte = [];
          let ruteCuSchimb = [];
          const PRAG_DISTANTA_METRI = 100;

          // 1. Căutare rute directe
          Object.keys(data).forEach(key => {
            if (['IDs', 'HomeTrasee', 'HomeTraseeTramvai', 'HomeTraseeTroleu', 'ZileVac'].includes(key)) return;
            const tr = data[key];
            if (!tr || typeof tr !== 'object') return;

            if (tr.StatiiTur) {
              const idxP = tr.StatiiTur.findIndex(s => s.stopId === fromId);
              const idxS = tr.StatiiTur.findIndex(s => s.stopId === toId);
              if (idxP !== -1 && idxS !== -1 && idxP < idxS) {
                ruteDirecte.push({ numar: key, sens: 'Tur', cap1: tr.Cap1, cap2: tr.Cap2 });
              }
            }
            if (tr.StatiiRetur) {
              const idxP = tr.StatiiRetur.findIndex(s => s.stopId === fromId);
              const idxS = tr.StatiiRetur.findIndex(s => s.stopId === toId);
              if (idxP !== -1 && idxS !== -1 && idxP < idxS) {
                ruteDirecte.push({ numar: key, sens: 'Retur', cap1: tr.Cap3 || tr.Cap1, cap2: tr.Cap4 || tr.Cap2 });
              }
            }
          });

          // 2. Căutare rute cu 1 schimb
          for (let linie1 in data) {
            if (['IDs', 'HomeTrasee', 'HomeTraseeTramvai', 'HomeTraseeTroleu', 'ZileVac'].includes(linie1)) continue;
            let t1 = data[linie1];

            ['StatiiTur', 'StatiiRetur'].forEach(sens1 => {
              if (!t1[sens1]) return;
              let idxP = t1[sens1].findIndex(s => s.stopId === fromId);
              if (idxP === -1) return;

              for (let i = idxP + 1; i < t1[sens1].length; i++) {
                let statieIntermed1 = t1[sens1][i];
                let coord1 = statieIntermed1.coord;

                for (let linie2 in data) {
                  if (linie2 === linie1 || ['IDs', 'HomeTrasee', 'HomeTraseeTramvai', 'HomeTraseeTroleu', 'ZileVac'].includes(linie2)) continue;
                  let t2 = data[linie2];

                  ['StatiiTur', 'StatiiRetur'].forEach(sens2 => {
                    if (!t2[sens2]) return;

                    for (let j = 0; j < t2[sens2].length; j++) {
                      let statieIntermed2 = t2[sens2][j];
                      let coord2 = statieIntermed2.coord;

                      let eAceeasiStatie = (statieIntermed1.stopId === statieIntermed2.stopId) || (statieIntermed1.nume === statieIntermed2.nume);
                      let distantaMetri = (!eAceeasiStatie && coord1 && coord2) ? calculeazaDistantaMetri(coord1, coord2) : 0;

                      if (eAceeasiStatie || (distantaMetri > 0 && distantaMetri <= PRAG_DISTANTA_METRI)) {
                        let idxS = t2[sens2].findIndex(s => s.stopId === toId);

                        if (idxS !== -1 && j < idxS) {
                          let detaliuSchimb = eAceeasiStatie ? 
                              `în stația <strong>${statieIntermed1.nume}</strong>` : 
                              `cobori la <strong>${statieIntermed1.nume}</strong> și mergi pe jos ~${Math.round(distantaMetri)}m până la <strong>${statieIntermed2.nume}</strong>`;

                          let obSchimb = {
                            linie1: linie1,
                            sens1: sens1 === 'StatiiTur' ? 'Tur' : 'Retur',
                            intermed1: statieIntermed1.nume,
                            linie2: linie2,
                            sens2: sens2 === 'StatiiTur' ? 'Tur' : 'Retur',
                            text: detaliuSchimb
                          };

                          if (!ruteCuSchimb.some(r => r.linie1 === obSchimb.linie1 && r.linie2 === obSchimb.linie2 && r.intermed1 === obSchimb.intermed1)) {
                            ruteCuSchimb.push(obSchimb);
                          }
                        }
                      }
                    }
                  });
                }
              }
            });
          }

          // 3. Randare în stilul cardurilor moderne din poză
          resultsContainer.innerHTML = "";

          if (ruteDirecte.length > 0) {
            ruteDirecte.forEach(r => {
              resultsContainer.innerHTML += `
                <div class="route-card">
                  <div class="route-header">
                    <span>⚡ Rută Directă</span>
                    <span style="color: #4ade80; font-weight: bold;">Nicio schimbare</span>
                  </div>
                  <div class="route-steps">
                    <span class="step-icon">🚶</span>
                    <span style="font-size: 0.85rem; opacity: 0.8;">Mergi la stație</span>
                    <span style="opacity: 0.5;">›</span>
                    <div class="route-pill">🚌 ${r.numar}</div>
                    <span style="opacity: 0.5;">›</span>
                    <span class="step-icon">🏁</span>
                    <span style="font-size: 0.85rem; opacity: 0.8;">Destinație</span>
                  </div>
                  <div class="route-footer">
                    <span style="opacity: 0.7;">Sens ${r.sens} (${r.cap1} - ${r.cap2})</span>
                    <a href="./traseu.html#${r.numar}.html" class="abtnlink" style="padding: 4px 10px; font-size: 0.85rem;">Vezi detalii ›</a>
                  </div>
                </div>
              `;
            });
          }

          if (ruteCuSchimb.length > 0) {
            ruteCuSchimb.slice(0, 5).forEach(r => {
              resultsContainer.innerHTML += `
                <div class="route-card">
                  <div class="route-header">
                    <span>🔄 Cu 1 schimb</span>
                    <span style="color: #facc15; font-weight: bold;">1 schimb</span>
                  </div>
                  <div class="route-steps" style="flex-wrap: wrap;">
                    <div class="route-pill" style="background: #4f46e5;">🚌 ${r.linie1}</div>
                    <span>›</span>
                    <span style="font-size: 0.85rem; background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 8px;">Schimb: ${r.intermed1}</span>
                    <span>›</span>
                    <div class="route-pill" style="background: #4f46e5;">🚌 ${r.linie2}</div>
                  </div>
                  <div style="font-size: 0.85rem; opacity: 0.85; line-height: 1.4;">
                    👉 ${r.text}
                  </div>
                  <div class="route-footer">
                    <span style="opacity: 0.7;">Conexiune inteligentă TCE</span>
                    <div class="display_flex gap_1">
                      <a href="./traseu.html#${r.linie1}.html" class="abtnlink" style="padding: 4px 8px; font-size: 0.8rem;">Linia ${r.linie1}</a>
                      <a href="./traseu.html#${r.linie2}.html" class="abtnlink" style="padding: 4px 8px; font-size: 0.8rem;">Linia ${r.linie2}</a>
                    </div>
                  </div>
                </div>
              `;
            });
          }

          if (ruteDirecte.length === 0 && ruteCuSchimb.length === 0) {
            resultsContainer.innerHTML = `
              <div class="route-card" style="text-align: center; padding: 25px;">
                <p style="color: #ff8888;">Nu s-a găsit nicio rută directă sau cu 1 schimb între aceste stații.</p>
              </div>
            `;
          }
        })
        .catch(err => {
          console.error(err);
          resultsContainer.innerHTML = `<div class="route-card" style="text-align: center; color: #ff8888;">Eroare la procesarea bazei de date.</div>`;
        });
    }
  </script>
</body>
</html>
