    function scrollDownFunc() {
      window.scrollTo({
        top: 400,
        behavior: 'smooth'
      });
    }
    
//decodeurlcomponent
    
    fetch('./JSON/anunturi.json')
      .then(response => response.json())
      .then(data => {
        data.Anunturi.slice(-3).reverse().forEach(anunt=> {
          anunt.TraseeAfectate.forEach(trafec => {
            TrAfectFull += TrAfectPreset(trafec);
          })
          document.getElementById('newscard').innerHTML += AnuntPreset(anunt);
          TrAfectFull = ``;
        });
        document.getElementById('newscard').innerHTML +=
          `<a class="abtnlink anews display_flex anews2 alignSelf_center" href="/anunturi.html">
            Vezi toate anunturile
          </a>`
      });

    let RPfromID, RPtoID;
    
    let TrBtnPreset = (tr, data) => data[tr] ?
      `<a class="abtnlink display_flex align_center" href=./traseu.html#${tr}.html>
         <div class="abtnlink-nr display_flex justify_center align_center"> <span>${tr}</span> </div>
         <span>${data[tr].Cap1} - ${data[tr].Cap2}</span>
       </a>` : '';
    
    fetch('./JSON/trasee.json')
      .then(response => response.json())
      .then(data => {
        dataa = data
        data.HomeTrasee.forEach(tr => {
          document.getElementById('trbtn').innerHTML += TrBtnPreset(tr, data);
        });
        data.HomeTraseeTramvai.forEach(tr => {
          document.getElementById('trbtnTrv').innerHTML += TrBtnPreset(tr, data);
        });
        data.HomeTraseeTroleu.forEach(tr => {
          document.getElementById('trbtnTro').innerHTML += TrBtnPreset(tr, data);
        });
        routePlannerSearch(document.getElementById('RPfrom'), RPfromID);
        routePlannerSearch(document.getElementById('RPto'), RPtoID);
      });

    function routePlannerSearch(inputElement, tId) {
      inputElement.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          if (document.getElementById('routeStopSearchResults')) {
            document.getElementById('routeStopSearchResults').remove();
          }
          let routeStopSearchResultsDIV = document.createElement('div');
          routeStopSearchResultsDIV.id = 'routeStopSearchResults';
          routeStopSearchResultsDIV.className = 'display_flex gap_1 flexDir_col justSelf_center alignSelf_center';
          // routeStopSearchResultsDIV.innerHTML = 'test';
          inputElement.after(routeStopSearchResultsDIV)
  
          if (query.length === 0) {
            routeStopSearchResultsDIV.remove();
            return;
          }
  
          const matches = dataa.IDs.filter(st => {
            if (!st.nume || st.nume.trim() === '') return false;
            return st.nume.toLowerCase().includes(query) || st.stopId.toLowerCase().includes(query);
          });
  
          // if (matches.length === 0) {
          //   OutputElement.style.display = 'none';
          //   return;
          // }
          // OutputElement.style.display = 'block';
  
          matches.forEach(st => {
            const item = document.createElement('div');
            item.className = 'search-item';
            item.innerHTML = `<a class="display_flex btnRouteStopSearchResult">${st.nume}</a>`;
            item.addEventListener('click', () => {
              inputElement.dataset.routesid = st.stopId;
              inputElement.value = st.nume; // Pune numele stației în input
              routeStopSearchResultsDIV.remove(); // Ascunde dropdown-ul
            });
            routeStopSearchResultsDIV.appendChild(item)
          });
        }, 200);
        
      })
      // document.addEventListener('click', (e) => {
      //   if (!inputElement.contains(e.target) && !OutputElement.contains(e.target)) {
      //     OutputElement.style.display = 'none';
      //   }
      // });
    };

    function routeGo() {
      fromID = document.getElementById('RPfrom').dataset.routesid;
      toID = document.getElementById('RPto').dataset.routesid;
      if (fromID && toID) {
        window.location.href = `./route.html?from=${fromID}&to=${toID}`
      } else {
        alert('Selecteaza statia de plecare si de sosire')
      }
    }

    
  </script>
