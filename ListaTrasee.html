<script>

  let TrBtnPreset = (tr, data) => data[tr] ?
      `<a class="abtnlink display_flex align_center" href=./traseu.html#${tr}.html>
         <div class="abtnlink-nr display_flex justify_center align_center"> <span>${tr}</span> </div>
         <span>${data[tr].Cap1} - ${data[tr].Cap2}</span>
       </a>` : '';

  
  fetch('./JSON/trasee.json')
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
            console.log(response.status)
          }
          return response.json();
        })
        .then(data => {
        // console.log(data);
        dataa = data;
        data.HomeTrasee.forEach(tr => {
          document.getElementById('trbtn').innerHTML += TrBtnPreset(tr, data);
        });
        data.HomeTraseeTramvai.forEach(tr => {
          document.getElementById('trbtnTrv').innerHTML += TrBtnPreset(tr, data);
        });
        data.HomeTraseeTroleu.forEach(tr => {
          document.getElementById('trbtnTro').innerHTML += TrBtnPreset(tr, data);
        });
      })
      .catch(err => console.error(err))
  
  </script>
